<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Sumbal 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff6fa5; --pink-d:#e0457f; --blush:#ffd3e6; --lav:#b9a4ff; --mint:#7fe0c3;
  --butter:#ffd966; --peach:#ffc8a8; --cream:#fff7fb; --ink:#5a2a4a;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;overflow:hidden;
  font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#ffd9ec 0%,#ffeef7 45%,#e4ecff 100%);
  background-color:#ffeef7;
  -webkit-tap-highlight-color:transparent;
}
#app{position:relative;width:100%;height:100%;overflow:hidden}

.floaties{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaty{position:absolute;bottom:-60px;font-size:var(--s);opacity:.55;animation:floatUp var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes floatUp{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(18px,-55vh) rotate(18deg)}100%{transform:translate(-10px,-115vh) rotate(-12deg)}}

.bunting{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-around;z-index:6;pointer-events:none;padding:0 2px}
.bunting::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:rgba(90,42,74,.25);border-radius:3px}
.flag{width:clamp(26px,8vw,40px);height:clamp(34px,10vw,50px);transform-origin:50% 0;animation:sway 2.6s ease-in-out infinite alternate;clip-path:polygon(0 0,100% 0,50% 100%)}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

.stage{
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:64px 20px 28px;text-align:center;
  opacity:0;visibility:hidden;transform:scale(.92);
  transition:opacity .5s,transform .5s,visibility 0s .5s;
}
.stage.active{opacity:1;visibility:visible;transform:none;transition:opacity .5s .1s,transform .5s .1s,visibility 0s}

h1,h2{margin:0;font-weight:700;line-height:1.1}
h2{font-size:clamp(1.7rem,7.5vw,2.6rem);color:var(--pink-d)}
.sub{margin:8px 0 0;font-size:1.15rem;font-weight:500}

/* cartoon Sumbal */
.sum svg{display:block;overflow:visible}
.armw{transform-origin:82px 97px;animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
.armcl{transform-origin:38px 97px;animation:cheerL .55s ease-in-out infinite alternate}
.armcr{transform-origin:82px 97px;animation:cheerR .55s ease-in-out infinite alternate}
@keyframes cheerL{from{transform:rotate(10deg)}to{transform:rotate(-14deg)}}
@keyframes cheerR{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.idle{animation:idle 2.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes idle{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.jump{animation:jump .8s cubic-bezier(.3,0,.4,1) infinite;transform-origin:50% 100%}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.04,.96)}45%{transform:translateY(-26px) scale(.97,1.04)}}

/* gift */
.hero{display:flex;align-items:flex-end;justify-content:center;gap:4px;margin-top:10px;width:100%}
.hero .sum{flex:none}
.cut{display:block;width:auto;max-width:none;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 8px 8px rgba(90,42,74,.28))}
.hero .cut{height:clamp(190px,32vh,270px)}
.giftwrap{position:relative;width:min(50vw,200px);cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0;font:inherit}
.giftwrap:focus-visible{outline:3px dashed var(--pink-d);outline-offset:8px;border-radius:24px}
.gift{width:100%;height:auto;overflow:visible;animation:hop 1.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.04,.96)}45%{transform:translateY(-22px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.05,.95)}}
.giftwrap:hover .gift{animation-duration:.7s}
#lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.3,1.5,.5,1),opacity .9s}
.giftwrap.open .gift{animation:none}
.giftwrap.open #lid{transform:translate(30px,-190px) rotate(32deg);opacity:0}
.giftwrap.open .shine{opacity:1;transform:scale(1.6)}
.shine{opacity:0;transform-origin:center;transform-box:fill-box;transition:all .6s}
.spark{position:absolute;font-size:1.5rem;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.5) rotate(0);opacity:.2}50%{transform:scale(1.2) rotate(20deg);opacity:1}}
.tap{margin-top:20px;font-size:1.2rem;font-weight:600;color:var(--pink-d);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* cake */
.cake{width:min(84vw,360px);height:auto;overflow:visible;margin-top:6px;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-8px) scale(.99,1.02)}}
.cake.cheer{animation:cheer 0.9s ease-in-out 3}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-28px) rotate(-5deg)}75%{transform:translateY(-28px) rotate(5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.candle{cursor:pointer;outline:none}
.candle:focus-visible .hit{stroke:var(--pink-d);stroke-width:2;stroke-dasharray:4 4}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .4s ease-in-out infinite alternate}
@keyframes flicker{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.85,1.15) rotate(4deg)}}
.candle.out .flame-wrap{opacity:0;transition:opacity .2s}
.smoke{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.candle.out .smoke{animation:smoke 1.5s ease-out forwards}
@keyframes smoke{0%{opacity:.8;transform:translateY(0) scaleX(1)}100%{opacity:0;transform:translateY(-36px) scaleX(1.8)}}
.hint{margin:10px 0 0;font-size:1.1rem;font-weight:500;min-height:1.5em}

button.btn{
  font:inherit;font-weight:600;font-size:1.1rem;cursor:pointer;border:0;border-radius:999px;
  padding:12px 24px;color:#fff;background:var(--pink);box-shadow:0 6px 0 var(--pink-d);
  transition:transform .12s,box-shadow .12s;touch-action:manipulation;
}
button.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--pink-d)}
button.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button.btn.alt{background:var(--lav);box-shadow:0 6px 0 #8a73e0}
button.btn.alt:active{box-shadow:0 1px 0 #8a73e0}
.pophide{opacity:0;transform:scale(.6);pointer-events:none;transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.pophide.show{opacity:1;transform:none;pointer-events:auto}

/* game */
#stage-game{justify-content:flex-start;padding:60px 0 0;touch-action:none}
.hud{width:min(92vw,420px);padding:0 4px}
.hud h2{font-size:1.5rem}
.bar{margin-top:8px;height:18px;border-radius:999px;background:#fff;overflow:hidden;border:2px solid var(--ink)}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--pink) 0 10px,#ff9cc4 10px 20px);transition:width .3s;border-radius:999px}
.score{margin-top:6px;font-weight:600}
#field{position:relative;flex:1;width:100%;overflow:hidden;cursor:grab;touch-action:none}
.item{position:absolute;left:0;top:0;font-size:40px;line-height:1;will-change:transform;user-select:none;z-index:1}
#basket{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;width:96px;height:120px;will-change:transform;z-index:2;pointer-events:none}
#basket .bk{position:relative;width:100%;height:100%;transform-origin:50% 100%;overflow:hidden;padding-top:6px;margin-top:-6px}
#basket .bk img{position:absolute;left:0;top:0;width:96px;height:auto;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 -2px 0 #fff)}
#basket .bk svg{position:absolute;left:-6px;bottom:0;width:108px;height:56px}
#basket.squish .bk{animation:squish .3s}
@keyframes squish{0%,100%{transform:scale(1,1)}40%{transform:scale(1.15,.88)}70%{transform:scale(.95,1.08)}}
.plus{position:absolute;font-weight:700;font-size:1.3rem;color:var(--pink-d);pointer-events:none;animation:plus .8s ease-out forwards;white-space:nowrap;z-index:3}
.plus.bad{color:#3a8a4a}
@keyframes plus{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
.gamehint{position:absolute;top:8px;left:0;right:0;font-weight:500;opacity:.7;pointer-events:none;transition:opacity .6s}

/* finale */
#stage-final{justify-content:flex-start;overflow-y:auto;padding:70px 18px 60px;-webkit-overflow-scrolling:touch}
#stage-final .sum{margin:0 auto -4px}
#stage-final .cut{height:clamp(170px,24vh,215px)}
#bigtitle{font-size:clamp(2.3rem,11vw,4.2rem);font-weight:700;line-height:1.05}
#bigtitle .ch{display:inline-block;animation:letter .8s cubic-bezier(.2,1.7,.4,1) both,wob 2.2s ease-in-out infinite;animation-delay:var(--dl),calc(var(--dl) + 1s)}
@keyframes letter{0%{transform:translateY(60px) scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(3deg)}}

.photos{display:flex;justify-content:center;align-items:flex-start;margin-top:22px;width:100%}
.pol{width:min(31vw,118px);background:#fff;padding:6px 6px 8px;border-radius:4px;box-shadow:0 8px 18px rgba(90,42,74,.25);opacity:0;flex:none}
.pol img{display:block;width:100%;aspect-ratio:1/1.12;object-fit:cover;object-position:50% 12%;border-radius:2px}
.pol p{margin:4px 0 0;font-family:Caveat,cursive;font-size:1.15rem;line-height:1;color:var(--ink)}
.photos .pol:nth-child(1){--r:-8deg;margin-right:-8px;position:relative;z-index:1;margin-top:10px}
.photos .pol:nth-child(2){--r:3deg;position:relative;z-index:3}
.photos .pol:nth-child(3){--r:9deg;margin-left:-8px;position:relative;z-index:2;margin-top:14px}
.photos.go .pol{animation:dropIn .9s cubic-bezier(.3,1.5,.5,1) forwards}
.photos.go .pol:nth-child(1){animation-delay:.5s}
.photos.go .pol:nth-child(2){animation-delay:1s}
.photos.go .pol:nth-child(3){animation-delay:1.5s}
@keyframes dropIn{0%{opacity:0;transform:translateY(-260px) rotate(-40deg) scale(.6)}100%{opacity:1;transform:rotate(var(--r))}}

/* six */
.six{position:relative;margin:14px auto 0;width:min(70vw,260px)}
.six .frame{background:#fff;padding:8px 8px 10px;border-radius:6px;box-shadow:0 10px 22px rgba(90,42,74,.28);transform:rotate(1.5deg);cursor:pointer;touch-action:manipulation;border:0;display:block;width:100%;font:inherit;color:inherit}
.six img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px}
.six .cap{font-family:Caveat,cursive;font-size:1.3rem;margin-top:4px;color:var(--ink)}
.six.hit .frame{animation:swing .6s ease-out}
@keyframes swing{0%{transform:rotate(1.5deg) scale(1)}25%{transform:rotate(-5deg) scale(1.05)}55%{transform:rotate(4deg) scale(1.08)}100%{transform:rotate(1.5deg) scale(1)}}
.ball{position:absolute;left:79.5%;top:44%;width:8%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.2);pointer-events:none;z-index:4;opacity:0}
.ball::after{content:"";position:absolute;inset:18% 6%;border-top:2px solid #d33;border-bottom:2px solid #d33;border-radius:50%}
.six.hit .ball{animation:fly 1.5s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(150px,-420px) scale(.25) rotate(900deg)}}
.sixtxt{position:absolute;left:50%;top:38%;z-index:5;font-weight:700;font-size:4.4rem;line-height:1;color:var(--butter);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-14deg)}
.six.hit .sixtxt{animation:sixpop 1.6s cubic-bezier(.2,1.6,.4,1) .15s forwards}
@keyframes sixpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-14deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(-6deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-80%) scale(1) rotate(-6deg)}}
.sixhint{margin:14px auto 0;max-width:300px;font-size:1.1rem;line-height:1.25;font-weight:600;color:var(--pink-d);animation:pulse 1.2s ease-in-out infinite}

.report{
  margin-top:26px;width:min(92vw,400px);padding:18px 18px 20px;border-radius:26px;background:var(--cream);
  border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);text-align:left;
  transform:translateY(40px) rotate(-1.5deg);opacity:0;transition:all .8s cubic-bezier(.2,1.3,.4,1) .6s;
}
.report.show{transform:rotate(-1.5deg);opacity:1}
.report h3{margin:0 0 10px;font-size:1.25rem;text-align:center;color:var(--pink-d)}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:2px dotted rgba(90,42,74,.25);font-weight:500}
.row b{font-weight:700;text-align:right}
.meter{margin:12px 0 4px;height:20px;border-radius:999px;border:2px solid var(--ink);background:#fff;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--butter),var(--pink));transition:width 2.4s cubic-bezier(.2,.8,.2,1) 1.6s}
.report.show .meter i{width:100%}
.msg{margin:14px 0 0;font-family:Caveat,"Segoe Script","Bradley Hand",cursive;font-size:1.7rem;line-height:1.25}
.from{margin:6px 0 0;text-align:right;font-family:Caveat,cursive;font-size:2rem;color:var(--pink-d)}
.actions{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;transition:opacity .6s .8s}
.actions.show{opacity:1}

#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.heart{position:absolute;bottom:-40px;pointer-events:none;z-index:4;animation:heartUp var(--d) ease-out forwards}
@keyframes heartUp{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-105vh) scale(1.3) rotate(25deg);opacity:0}}

@media (prefers-reduced-motion: reduce){
  .floaty,.flag,.gift,.cake,.eye,.flame,.spark,.tap,.armw,.armcl,.armcr,.idle,.jump,.blink,.sixhint{animation:none}
  #bigtitle .ch{animation:letter .01s both}
}
</style>
</head>
<body>
<div id="app">
  <div class="floaties" id="floaties" aria-hidden="true"></div>
  <div class="bunting" id="bunting" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- 1. GIFT -->
  <section class="stage active" id="stage-gift">
    <h2>Hey Sumbal!</h2>
    <p class="sub">Somebody left a little something for you…</p>
    <div class="hero">
      <button class="giftwrap" id="giftBtn" aria-label="Open your birthday gift">
        <span class="spark" style="left:-6%;top:8%">✨</span>
        <span class="spark" style="right:-4%;top:2%;animation-delay:.5s">⭐</span>
        <span class="spark" style="right:6%;bottom:6%;animation-delay:1s">✨</span>
        <svg class="gift" viewBox="0 0 240 240" aria-hidden="true">
          <ellipse cx="120" cy="228" rx="90" ry="9" fill="rgba(90,42,74,.15)"/>
          <circle class="shine" cx="120" cy="120" r="70" fill="#fff6b0"/>
          <rect x="40" y="108" width="160" height="116" rx="16" fill="#ff6fa5"/>
          <rect x="108" y="108" width="24" height="116" fill="#ffd966"/>
          <ellipse cx="88" cy="160" rx="7" ry="9" fill="#5a2a4a"/><ellipse cx="152" cy="160" rx="7" ry="9" fill="#5a2a4a"/>
          <circle cx="90" cy="157" r="2.5" fill="#fff"/><circle cx="154" cy="157" r="2.5" fill="#fff"/>
          <ellipse cx="70" cy="178" rx="11" ry="6" fill="#ff9cc4"/><ellipse cx="170" cy="178" rx="11" ry="6" fill="#ff9cc4"/>
          <path d="M108 172 q12 14 24 0" fill="none" stroke="#5a2a4a" stroke-width="4.5" stroke-linecap="round"/>
          <g id="lid">
            <rect x="28" y="78" width="184" height="42" rx="14" fill="#ff8fbd"/>
            <rect x="108" y="78" width="24" height="42" fill="#ffd966"/>
            <ellipse cx="98" cy="64" rx="26" ry="16" transform="rotate(-24 98 64)" fill="#ffd966"/>
            <ellipse cx="142" cy="64" rx="26" ry="16" transform="rotate(24 142 64)" fill="#ffd966"/>
            <circle cx="120" cy="72" r="11" fill="#ffc233"/>
          </g>
        </svg>
      </button>
    </div>
    <p class="tap">Tap the gift! 🎁</p>
  </section>

  <!-- 2. CAKE -->
  <section class="stage" id="stage-cake">
    <h2 id="cakeTitle">Make a wish, Sumbal 🌟</h2>
    <p class="sub" id="cakeSub">Then blow out the candles</p>
    <svg class="cake" id="cake" viewBox="0 0 320 310" role="group" aria-label="Cute birthday cake with five candles">
      <ellipse cx="160" cy="290" rx="150" ry="14" fill="#d9c9f5"/>
      <ellipse cx="160" cy="284" rx="150" ry="14" fill="#f4ecff"/>
      <rect x="28" y="190" width="264" height="92" rx="22" fill="#ff8fbd"/>
      <path d="M28 212 q0 -22 22 -22 h220 q22 0 22 22 v4 q-12 15 -26 0 q-12 18 -28 0 q-12 16 -26 0 q-12 18 -28 0 q-12 16 -26 0 q-12 18 -28 0 q-12 15 -26 0 z" fill="#fff7fb"/>
      <g>
        <ellipse class="eye" cx="115" cy="245" rx="7" ry="9" fill="#5a2a4a"/><ellipse class="eye" cx="205" cy="245" rx="7" ry="9" fill="#5a2a4a"/>
        <circle cx="117" cy="242" r="2.5" fill="#fff"/><circle cx="207" cy="242" r="2.5" fill="#fff"/>
        <ellipse cx="92" cy="260" rx="13" ry="7" fill="#ff5c9a" opacity=".55"/><ellipse cx="228" cy="260" rx="13" ry="7" fill="#ff5c9a" opacity=".55"/>
        <path d="M148 254 q12 15 24 0" fill="none" stroke="#5a2a4a" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <rect x="62" y="128" width="196" height="68" rx="18" fill="#ffd3b8"/>
      <path d="M62 146 q0 -18 18 -18 h160 q18 0 18 18 v3 q-10 13 -22 0 q-10 15 -22 0 q-10 17 -24 0 q-10 15 -22 0 q-10 17 -24 0 q-10 13 -20 0 z" fill="#fff7fb"/>
      <circle cx="96" cy="176" r="4.5" fill="#ff6fa5"/><circle cx="150" cy="184" r="4.5" fill="#7fe0c3"/>
      <circle cx="200" cy="174" r="4.5" fill="#ff6fa5"/><circle cx="238" cy="184" r="4.5" fill="#b9a4ff"/>
      <g id="candles"></g>
    </svg>
    <p class="hint" id="hint">Tap each candle</p>
    <button class="btn pophide" id="toGame">Now catch your treats 🧁</button>
  </section>

  <!-- 3. GAME -->
  <section class="stage" id="stage-game">
    <div class="hud">
      <h2>Catch the treats!</h2>
      <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
      <div class="score" id="score">0 / 6 treats</div>
    </div>
    <div id="field">
      <div class="gamehint" id="gameHint">Drag to move Sumbal · dodge the broccoli 🥦</div>
      <div id="basket" class="sum"></div>
    </div>
  </section>

  <!-- 4. FINALE -->
  <section class="stage" id="stage-final">
    <div id="bigtitle" aria-label="Happy Birthday Sumbal"></div>
    <p class="sixhint" id="sixhint">Sumbal, tap your photo and hit it for six 🏏</p>

    f.appendChild(d);
  }
})();

/* bunting */
(function(){
  const b=$("bunting"), cs=["#ff6fa5","#ffd966","#7fe0c3","#b9a4ff","#ffc8a8"];
  const n=Math.max(8,Math.round(innerWidth/42));
  for(let i=0;i<n;i++){
    const s=document.createElement("span"); s.className="flag";
    s.style.background=cs[i%cs.length];
    s.style.animationDelay=(-Math.random()*2.6)+"s";
    b.appendChild(s);
  }
})();

function show(id){ document.querySelectorAll(".stage").forEach(s=>s.classList.toggle("active",s.id===id)); }

/* confetti */
const cv=$("confetti"), ctx=cv.getContext("2d");
let W,H,DPR=1,pieces=[],raf=null;
function size(){ DPR=window.devicePixelRatio||1; W=cv.width=cv.clientWidth*DPR; H=cv.height=cv.clientHeight*DPR; }
size(); addEventListener("resize",size);
function burst(count){
  if(reduce) count=Math.round(count/4);
  for(let i=0;i<count;i++){
    const side=i%2, a=(side?180-(50+Math.random()*30):(50+Math.random()*30))*Math.PI/180;
    const sp=(11+Math.random()*13)*DPR;
    pieces.push({x:side?W:0,y:H*0.85,vx:Math.cos(a)*sp,vy:-Math.sin(a)*sp,
      w:(6+Math.random()*7)*DPR,h:(9+Math.random()*9)*DPR,rot:Math.random()*6.28,vr:(Math.random()-.5)*.35,
      c:palette[(Math.random()*palette.length)|0],round:Math.random()<.25});
  }
  if(!raf) raf=requestAnimationFrame(tickC);
}
function rain(count){
  for(let i=0;i<count;i++){
    pieces.push({x:Math.random()*W,y:-20*DPR,vx:(Math.random()-.5)*2*DPR,vy:(2+Math.random()*3)*DPR,
      w:(6+Math.random()*6)*DPR,h:(9+Math.random()*8)*DPR,rot:Math.random()*6.28,vr:(Math.random()-.5)*.25,
      c:palette[(Math.random()*palette.length)|0],round:Math.random()<.25});
  }
  if(!raf) raf=requestAnimationFrame(tickC);
}
function tickC(){
  ctx.clearRect(0,0,W,H);
  pieces.forEach(p=>{
    p.vy+=0.36*DPR; p.vx*=0.993; p.vy*=0.993; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
    if(p.round){ctx.beginPath();ctx.arc(0,0,p.w/2,0,6.28);ctx.fill();} else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });
  pieces=pieces.filter(p=>p.y<H+40*DPR);
  if(pieces.length) raf=requestAnimationFrame(tickC); else {raf=null;ctx.clearRect(0,0,W,H);}
}

/* hearts */
function heart(x){
  const h=document.createElement("span"); h.className="heart";
  h.textContent=["✨","🌸","⭐","🌼","🎈"][(Math.random()*5)|0];
  h.style.left=(x??Math.random()*92)+"%"; h.style.fontSize=(20+Math.random()*24)+"px";
  h.style.setProperty("--d",(3+Math.random()*2.5)+"s");
  $("app").appendChild(h); setTimeout(()=>h.remove(),6000);
}
let heartTimer=null;
function heartsOn(){ clearInterval(heartTimer); heartTimer=setInterval(()=>heart(),450); }
function heartsOff(){ clearInterval(heartTimer); }

/* 1. gift */
$("giftBtn").addEventListener("click",()=>{
  const g=$("giftBtn"); if(g.classList.contains("open")) return;
  g.classList.add("open");
  setTimeout(()=>burst(120),250);
  setTimeout(()=>{ show("stage-cake"); },1500);
});

/* 2. cake */
const cols=["#7fe0c3","#ff6fa5","#ffd966","#b9a4ff","#7fe0c3"], xs=[96,128,160,192,224];
let blown=0;
const cg=$("candles");
xs.forEach((x,i)=>{
  const c=document.createElementNS(NS,"g");
  c.setAttribute("class","candle"); c.setAttribute("tabindex","0"); c.setAttribute("role","button");
  c.setAttribute("aria-label","Candle "+(i+1)+", blow it out");
  c.innerHTML=
    '<rect x="'+(x-5)+'" y="88" width="10" height="44" rx="3" fill="'+cols[i]+'"/>'+
    '<path d="M'+(x-5)+' 100 l10 -6 M'+(x-5)+' 112 l10 -6 M'+(x-5)+' 124 l10 -6" stroke="#fff7fb" stroke-width="2.5" opacity=".75"/>'+
    '<line x1="'+x+'" y1="88" x2="'+x+'" y2="81" stroke="#5a2a4a" stroke-width="2"/>'+
    '<g class="flame-wrap"><path class="flame" d="M'+x+' 52 C'+(x+9)+' 64 '+(x+8)+' 79 '+x+' 79 C'+(x-8)+' 79 '+(x-9)+' 64 '+x+' 52Z" fill="#ffb347"/>'+
    '<ellipse cx="'+x+'" cy="70" rx="3.5" ry="6" fill="#fff4b0"/></g>'+
    '<path class="smoke" d="M'+x+' 74 q-6 -8 0 -16 q6 -8 0 -16" fill="none" stroke="#c9b8e8" stroke-width="3" stroke-linecap="round"/>'+
    '<circle class="hit" cx="'+x+'" cy="72" r="20" fill="transparent"/>';
  const blow=()=>{
    if(c.classList.contains("out")) return;
    c.classList.add("out"); c.setAttribute("aria-label","Candle "+(i+1)+", blown out");
    blown++; const left=xs.length-blown;
    $("hint").textContent = left>1? left+" candles left" : left===1? "One more…" : "";
    if(left===0) wishDone();
  };
  c.addEventListener("click",blow);
  c.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();blow();} });
  cg.appendChild(c);
});
function wishDone(){
  $("cakeTitle").textContent="Wish made! ✨";
  $("cakeSub").textContent="It’s going to come true. Trust me.";
  $("cake").classList.add("cheer");
  burst(110); for(let i=0;i<6;i++) setTimeout(()=>heart(20+Math.random()*60),i*150);
  setTimeout(()=>$("toGame").classList.add("show"),900);
}
$("toGame").addEventListener("click",startGame);

/* 3. game */
const field=$("field"), basket=$("basket");
const good=["🧁","🍰","🍩","🍓","🍭","🍫","⭐","🍪"], bad="🥦";
let running=false, score=0, items=[], bx=0, last=0, spawnAcc=0, gameRaf=null;
function setBasket(clientX){
  const r=field.getBoundingClientRect();
  bx=Math.max(48,Math.min(r.width-48,clientX-r.left));
}
field.addEventListener("pointermove",e=>setBasket(e.clientX));
field.addEventListener("pointerdown",e=>{ setBasket(e.clientX); $("gameHint").style.opacity=0; });
addEventListener("keydown",e=>{ if(!running) return;
  if(e.key==="ArrowLeft") bx=Math.max(48,bx-40);
  if(e.key==="ArrowRight") bx=Math.min(field.clientWidth-48,bx+40);
});
function startGame(){
  show("stage-game");
  score=0; updateScore();
  items.forEach(i=>i.el.remove()); items=[];
  $("gameHint").style.opacity=1;
  setTimeout(()=>{
    bx=field.clientWidth/2; running=true; last=performance.now(); spawnAcc=0;
    cancelAnimationFrame(gameRaf); gameRaf=requestAnimationFrame(loop);
    setTimeout(()=>{ $("gameHint").style.opacity=0; },4500);
  },500);
}
function updateScore(){
  $("score").textContent=score+" / "+GOAL+" treats";
  $("barFill").style.width=(score/GOAL*100)+"%";
}
function popText(txt,x,y,badFlag){
  const p=document.createElement("div"); p.className="plus"+(badFlag?" bad":""); p.textContent=txt;
  p.style.left=x+"px"; p.style.top=y+"px"; field.appendChild(p); setTimeout(()=>p.remove(),800);
}
function spawn(){
  const isBad=Math.random()<0.17, el=document.createElement("div");
  el.className="item"; el.textContent=isBad?bad:good[(Math.random()*good.length)|0];
  field.appendChild(el);
  const x=24+Math.random()*(field.clientWidth-48);
  items.push({el,x,y:-50,vy:(120+Math.random()*90+score*6)*(field.clientHeight/600),isBad,rot:(Math.random()-.5)*60});
}
function loop(t){
  if(!running) return;
  const dt=Math.min(.05,(t-last)/1000); last=t; spawnAcc+=dt;
  if(spawnAcc>Math.max(.45,.85-score*.025)){ spawnAcc=0; spawn(); }
  const fh=field.clientHeight, rimY=fh-10-120+74-24, bw=44;
  basket.style.transform="translateX("+(bx-48)+"px)";
  for(let i=items.length-1;i>=0;i--){
    const it=items[i]; it.y+=it.vy*dt;
    it.el.style.transform="translate("+(it.x-20)+"px,"+it.y+"px) rotate("+(it.y*0.3+it.rot)+"deg)";
    if(it.y+30>=rimY && it.y<=rimY+26 && Math.abs(it.x-bx)<bw){
      basket.classList.remove("squish"); void basket.offsetWidth; basket.classList.add("squish");
      if(it.isBad){ score=Math.max(0,score-1); popText("Eww, broccoli! −1",it.x,rimY-30,true); }
      else { score++; popText("+1 "+it.el.textContent,it.x,rimY-30,false); }
      updateScore(); it.el.remove(); items.splice(i,1);
      if(score>=GOAL){ running=false; setTimeout(finale,500); return; }
    } else if(it.y>fh+20){ it.el.remove(); items.splice(i,1); }
  }
  gameRaf=requestAnimationFrame(loop);
}

/* 4. finale */
function buildTitle(){
  const t=$("bigtitle"); t.textContent=""; let n=0;
  const lines=[["Happy Birthday",null],[NAME+"!","p"]];
  lines.forEach(ln=>{
    const row=document.createElement("div"); t.appendChild(row);
    [...ln[0]].forEach(chr=>{
      const s=document.createElement("span"); s.className="ch";
      s.textContent=chr===" "?"\u00a0":chr;
      s.style.color=ln[1]?palette[(n)%5]:"var(--pink-d)";
      s.style.setProperty("--dl",(n*55)+"ms"); n++;
      row.appendChild(s);
    });
  });
}
function finale(){
  show("stage-final");
  $("stage-final").scrollTop=0;
  buildTitle();
  $("msg").textContent=MESSAGE; $("from").textContent="– "+FROM;
  $("sixhint").textContent="Sumbal, tap your photo and hit it for six 🏏";
  $("report").classList.remove("show"); $("actions").classList.remove("show");
  items.forEach(i=>i.el.remove()); items=[];
  setTimeout(()=>{ burst(160); heartsOn(); },300);
}
let sixBusy=false;
$("sixBtn").addEventListener("click",()=>{
  if(sixBusy) return; sixBusy=true;
  const s=$("six"); s.classList.remove("hit"); void s.offsetWidth; s.classList.add("hit");
  setTimeout(()=>{ burst(120); for(let i=0;i<5;i++) setTimeout(()=>heart(15+Math.random()*70),i*120); },350);
  setTimeout(()=>{
    $("sixhint").textContent="SIX! 🎉 Here’s your wish";
    $("report").classList.add("show"); $("actions").classList.add("show");
    $("report").scrollIntoView({behavior:"smooth",block:"center"});
    rain(70);
  },1300);
  setTimeout(()=>{ s.classList.remove("hit"); sixBusy=false; },1900);
});
$("again").addEventListener("click",()=>{ burst(180); rain(60); });
$("replay").addEventListener("click",()=>{ heartsOff(); startGame(); });
</script>
